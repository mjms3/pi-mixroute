version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pi:
        patterns:
          - '@earendil-works/pi-*'
      development-tools:
        patterns:
          - '@biomejs/biome'
          - '@types/node'
          - c8
          - tsx
          - typescript
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
